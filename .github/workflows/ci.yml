name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The unit tests cover calibration, speed, tracking and reporting logic
      # and do not need torch - install a light, fast subset instead of the
      # full package dependencies.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pytest ruff
          pip install -e . --no-deps

      - name: Lint
        run: ruff check speedcheck tests

      - name: Test
        run: pytest -q
