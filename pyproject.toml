[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cars-speed-check"
version = "2.0.0"
description = "Vehicle speed estimation from video: YOLO detection, ByteTrack tracking, perspective-aware calibration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ALSRKAL" }]
keywords = ["opencv", "yolo", "bytetrack", "vehicle-speed", "computer-vision", "traffic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "ultralytics>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
carspeed = "speedcheck.cli:main"

[project.urls]
Repository = "https://github.com/ALSRKAL/cars_speed_check"

[tool.hatch.build.targets.wheel]
packages = ["speedcheck"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
